<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Manutenzioni"><title>🔧 Manutenzioni</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#19313b;background:#f4f7f7}*{box-sizing:border-box}body{margin:0}header{background:#123c49;color:white;padding:calc(22px + env(safe-area-inset-top)) 18px 24px}h1{margin:0;font-size:26px}header p{margin:6px 0 0;opacity:.85}main{max-width:680px;margin:auto;padding:16px 14px 60px}.panel,.job{background:white;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 12px #123c4910}.panel h2{font-size:18px;margin:0 0 13px}label{display:block;font-size:14px;font-weight:650;margin:12px 0 5px}input{width:100%;font-size:17px;padding:13px;border:1px solid #cbd7db;border-radius:10px}.priority{display:flex;gap:8px}.priority button{flex:1;border:2px solid transparent;background:#f1f3f4;padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px}.priority button[aria-pressed=true]{border-color:#173f4c;background:#e4f2f4}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:5px;vertical-align:-1px}.low{background:#2aa66b}.mid{background:#e8b32b}.high{background:#e44d4d}.primary{width:100%;background:#087e8d;color:white;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:15px}.tabs{display:flex;gap:8px;margin:18px 0 12px}.tabs button{flex:1;border:0;border-radius:11px;padding:12px;background:#e1e8ea;color:#26424c;font-weight:700}.tabs button.active{background:#123c49;color:white}.job{display:flex;align-items:flex-start;gap:12px;border-left:6px solid #2aa66b}.job.mid-border{border-left-color:#e8b32b}.job.high-border{border-left-color:#e44d4d}.job input[type=checkbox]{width:25px;height:25px;flex:none;margin:3px 0;accent-color:#087e8d}.job .info{flex:1;min-width:0}.job strong{font-size:17px;overflow-wrap:anywhere}.meta{color:#687a80;font-size:13px;margin-top:5px}.controls{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.controls select{padding:7px;border:1px solid #cbd7db;border-radius:8px;background:#fff;font-size:14px}.delete{border:0;background:#fbecec;color:#a02b2b;padding:8px;border-radius:8px}.empty{text-align:center;color:#667c83;padding:24px}.foot{font-size:12px;color:#667c83;line-height:1.5;margin-top:20px}.tools{display:flex;gap:8px}.tools button{flex:1;border:1px solid #b8cbd1;border-radius:9px;padding:10px;background:#fff;font-weight:600;color:#23424d}</style></head><body><header><h1>🔧 Manutenzioni</h1><p>Le urgenze crescono automaticamente ogni 5 giorni</p></header><main><section class="panel"><h2>➕ Nuovo intervento</h2><form id="form"><label for="name">Lavoro da fare</label><input id="name" required placeholder="Es. Controllare pompa acqua" maxlength="180"><label for="place">Macchina / reparto (facoltativo)</label><input id="place" placeholder="Es. Reparto confezionamento" maxlength="120"><label>Priorità iniziale</label><div class="priority" id="priority"><button type="button" data-p="0" aria-pressed="true"><i class="dot low"></i>Bassa</button><button type="button" data-p="1" aria-pressed="false"><i class="dot mid"></i>Media</button><button type="button" data-p="2" aria-pressed="false"><i class="dot high"></i>Alta</button></div><button class="primary" type="submit">+ Aggiungi lavoro</button></form></section><div class="tabs"><button id="pendingTab" class="active">Da fare (0)</button><button id="doneTab">Completati (0)</button></div><div id="jobs"></div><section class="panel"><h2>Salva una copia</h2><div class="tools"><button id="export">Esporta backup</button><button id="import">Importa backup</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="foot">I lavori vengono salvati su questo dispositivo e in questo browser. Se cancelli i dati di Safari, potresti perderli: conserva periodicamente una copia di backup. Non vengono inviati a un server.</p></section></main><script>(()=>{'use strict';const KEY='manutenzioni_v2';let items=[];try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))items=stored.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.created));}catch(e){}let priority=0,tab='pending';const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('Salvataggio non disponibile in questa modalità. Apri l’agenda da Safari tramite un sito web.');return false}};const effective=j=>Math.min(2,Math.max(0,Number(j.base)||0)+Math.floor(Math.max(0,Date.now()-j.created)/432000000));const date=t=>new Date(t).toLocaleDateString('it-IT');function render(){const pending=items.filter(x=>!x.done).sort((a,b)=>effective(b)-effective(a)||a.created-b.created),done=items.filter(x=>x.done).sort((a,b)=>(b.completed||0)-(a.completed||0));$('pendingTab').textContent=`Da fare (${pending.length})`;$('doneTab').textContent=`Completati (${done.length})`;$('pendingTab').classList.toggle('active',tab==='pending');$('doneTab').classList.toggle('active',tab==='done');const target=$('jobs');target.replaceChildren();const show=tab==='pending'?pending:done;if(!show.length){const e=document.createElement('div');e.className='empty';e.textContent=tab==='pending'?'Nessun lavoro da fare 🎉':'Nessun lavoro completato';target.append(e)}show.forEach(j=>{const p=effective(j),names=['Bassa','Media','Alta'],cls=['low','mid','high'];const card=document.createElement('div');card.className='job '+cls[p]+'-border';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!j.done;cb.setAttribute('aria-label','Segna completato');cb.addEventListener('change',()=>{j.done=cb.checked;j.completed=j.done?Date.now():null;save();render()});const info=document.createElement('div');info.className='info';const title=document.createElement('strong');title.textContent=j.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=(j.place?j.place+' · ':'')+'Inserito il '+date(j.created)+(j.done?' · Completato il '+date(j.completed||Date.now()):'');const controls=document.createElement('div');controls.className='controls';const badge=document.createElement('span');const dot=document.createElement('i');dot.className='dot '+cls[p];badge.append(dot,document.createTextNode(names[p]));controls.append(badge);if(!j.done){const select=document.createElement('select');select.setAttribute('aria-label','Cambia priorità iniziale');names.forEach((n,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent='Imposta '+n;opt.selected=i===j.base;select.append(opt)});select.addEventListener('change',()=>{j.base=Number(select.value);j.created=Date.now();save();render()});controls.append(select)}const del=document.createElement('button');del.className='delete';del.textContent='Elimina';del.addEventListener('click',()=>{if(confirm('Eliminare questo lavoro?')){items=items.filter(x=>x.id!==j.id);save();render()}});controls.append(del);info.append(title,meta,controls);card.append(cb,info);target.append(card)})}document.querySelectorAll('#priority button').forEach(b=>b.addEventListener('click',()=>{priority=Number(b.dataset.p);document.querySelectorAll('#priority button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name,place:$('place').value.trim(),base:priority,created:Date.now(),done:false,completed:null});save();$('form').reset();priority=0;document.querySelectorAll('#priority button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.p)===0)));tab='pending';render()});$('pendingTab').addEventListener('click',()=>{tab='pending';render()});$('doneTab').addEventListener('click',()=>{tab='done';render()});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-manutenzioni-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});$('import').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x.name==='string'&&Number.isFinite(x.created)&&[0,1,2].includes(x.base)))throw Error();if(confirm('Sostituire la lista attuale con il backup?')){items=data;save();render()}}catch(e){alert('Questo file non è un backup valido.')}e.target.value=''});render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(render,60000)})();</script></body></html>
